
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f7fa;
        }
        form {
            background: white;
            padding: 24px;
            border-radius: 10px;
        }
        label {
            display: block;
            margin-top: 16px;
        }
        input, select {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 6px;
        }
        button { margin-top: 20px; padding: 10px 20px; }
    </style>
</head>
<body>
    <h1>{{ page_title }}</h1>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <label for="title">歌名</label>
        <input
            id="title"
            name="title"
            type="text"
            value="{{ song.title if song else '' }}"
            required>

        <label for="artist">歌手</label>
        <input
            id="artist"
            name="artist"
            type="text"
            value="{{ song.artist if song else '' }}"
            required>

        <label for="source">出處</label>
        <input
            id="source"
            name="source"
            type="text"
            value="{{ song.source if song else '' }}"
            required>

        <label for="category_id">歌曲分類</label>
        <select id="category_id" name="category_id" required>
            {% for category in categories %}
                <option
                    value="{{ category.id }}"
                    {% if song and song.category_id == category.id %}
                        selected
                    {% endif %}>
                    {{ category.name }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">儲存</button>
        <a href="{{ url_for('index') }}">返回歌單</a>
    </form>
</body>
</html>
